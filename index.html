<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style.css">
	<title>Reviews</title>
</head>

<body>
	<main>
		<section class="reviews">
			<div class="reviews__header">
				<h1 class="reviews__title">our reviews</h1>
				<div class="reviews__title-underline">--------</div>
			</div>

			<article class="reviews__item review">
				<div class="review__author-img-wrapper">
					<img class="review__author-img" src="/" alt="author">
				</div>
				<h4 class="review__author-name">Sara Jones</h4>
				<p class="review__author-job">ux designer</p>
				<p class="review">
					Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatibus voluptatum laudantium omnis placeat.
					Quasi, harum?
				</p>
			</article>
		</section>
	</main>
	<!-- javascript -->
	<script type="module" src="js/app.js"></script>
</body>

</html>
