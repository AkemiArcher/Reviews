<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
	<link rel="stylesheet" href="css/style.css">
	<title>Reviews</title>
</head>

<body>
	<main class="container">
		<section class="reviews">
			<div class="reviews__header">
				<h1 class="reviews__header-title">our reviews</h1>
				<div class="reviews__header-title-underline"></div>
			</div>

			<article class="reviews__item review">
				<div class="review__author-img-wrapper">
					<img id="author-img" class="review__author-img" src="/" alt="author">
				</div>
				<h4 id="author-name" class="review__author-name">Sara Jones</h4>
				<p id="author-job" class="review__author-job">ux designer</p>
				<p id="review__text" class="review__text">
					Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatibus voluptatum laudantium omnis placeat.
					Quasi, harum?
				</p>
				<div class="review__button-wrapper">
					<a id="prev-btn" class="review__chevron-button fas fa-chevron-left"></a>
					<a id="next-btn" class="review__chevron-button fas fa-chevron-right"></a>
				</div>
				<button type="button" class="review__rnd-button">surprise me</button>
			</article>
		</section>
	</main>
	<!-- javascript -->
	<script type="module" src="js/app.js"></script>
</body>

</html>
